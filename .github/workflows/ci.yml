name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bloqer_ci
          POSTGRES_PASSWORD: bloqer-ci-disposable-only
          POSTGRES_DB: bloqer_ci_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloqer_ci -d bloqer_ci_pilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (no DB required)
        run: pnpm ci:prisma

      - name: Prepare disposable authenticated fixtures
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://bloqer_ci:bloqer-ci-disposable-only@127.0.0.1:5432/bloqer_ci_pilot
          DIRECT_URL: postgresql://bloqer_ci:bloqer-ci-disposable-only@127.0.0.1:5432/bloqer_ci_pilot
          SEED_USER_EMAIL: pilot-ci@example.invalid
          SEED_USER_PASSWORD: bloqer-ci-synthetic-user-only
          DOCS_USER_EMAIL: pilot-ci@example.invalid
          DOCS_DEMO_SEED: "1"
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec tsx src/seed.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Unit tests (all workspace test suites)
        run: pnpm test

      - name: Check AI documentation index
        run: pnpm ai:check-docs-index

      - name: Production build with isolated services
        working-directory: apps/web
        env:
          APP_ENV: test
          AUTH_SECRET: bloqer-ci-public-smoke-synthetic-secret
          AUTH_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          APP_URL: http://127.0.0.1:3100
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build?connect_timeout=1
          DIRECT_URL: postgresql://build:build@127.0.0.1:1/build?connect_timeout=1
          BLOQER_AI_ENABLED: "false"
          BLOQER_AI_ALLOW_PRODUCTION: "false"
          BLOQER_AI_SUPPLIER_INVOICE_PREVIEW_ENABLED: "false"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Install Chromium for public smoke
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Headless public smoke (desktop, tablet and phone)
        working-directory: apps/web
        run: pnpm test:e2e:public

      - name: Upload public smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/public-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Authenticated smoke with disposable Postgres
        working-directory: apps/web
        env:
          E2E_USER_EMAIL: pilot-ci@example.invalid
          E2E_USER_PASSWORD: bloqer-ci-synthetic-user-only
        run: pnpm test:e2e:authenticated

      - name: Upload authenticated smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-smoke-${{ github.sha }}
          path: |
            apps/web/playwright-report-authenticated/
            apps/web/test-results/authenticated-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # Job-level `if` cannot reference `secrets` (GitHub rejects the workflow).
  # Probe secrets inside a step and expose a boolean output instead.
  check-e2e-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -n "$E2E_BASE_URL" ] && [ -n "$E2E_USER_EMAIL" ] && [ -n "$E2E_USER_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: check-e2e-secrets
    if: needs.check-e2e-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm test:e2e
